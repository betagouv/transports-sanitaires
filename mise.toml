[tools]
node = "24.16.0"
# La CLI GitHub, pour créer la release d'une livraison (cf. le skill
# `livrer-une-version`). Épinglée comme Node : le toolchain ne dépend pas de ce
# que la machine a d'installé.
gh = "2.98.0"
# pnpm, le gestionnaire de paquets du dépôt. Épinglé comme Node et `gh` : le
# toolchain ne dépend pas de ce que la machine a d'installé. La même version est
# redite dans `packageManager` à la racine, que Corepack et la CI lisent.
pnpm = "11.23.0"

# Ce fichier ne porte que le toolchain. Les gestes du dépôt (installer, lancer,
# vérifier) passent par `tsp` : voir apps/cli/README.md.
