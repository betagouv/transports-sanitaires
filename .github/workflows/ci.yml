name: CI

on:
  push:
    branches: [main]
  pull_request:

# Le dépôt est un **workspace pnpm** : une seule installation à la racine, un
# seul `pnpm-lock.yaml`, un magasin mutualisé. Chaque app garde en revanche son
# job et son **`pnpm verifier`**, la même commande que localement — c'est ce qui
# garantit qu'un `verifier` vert ici l'est aussi là-bas. Toute porte ajoutée se
# met dans le script, jamais dans ce fichier.
#
# `--filter <app>` cible une app. `pnpm install` reste global : le lock l'est, et
# le cache pnpm rend la répétition entre jobs peu coûteuse.
jobs:
  simulateur-eligibilite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # La version de pnpm vient de `packageManager` à la racine, pas d'ici.
      - uses: actions/setup-node@v4
        with:
          # La version supportée est déclarée par la racine (`engines.node`), pas ici.
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # lint → typecheck → knip → validation des règles → tests → build
      # (+ vérification de bundle en `postbuild`).
      - run: pnpm --filter simulateur-eligibilite verifier

  data-analyzer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter data-analyzer verifier

  glossaire-notion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter glossaire-notion verifier

  # L'audit ne se scope pas : `pnpm audit` lit le lock, et le lock est unique au
  # dépôt depuis le passage en workspace. Le répéter dans les trois jobs
  # auditerait trois fois la même chose en laissant croire le contraire — il a
  # donc son job.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Ce qui part en production : bloquant. Le simulateur parse du YAML fourni
      # par l'utilisateur (mode labo), la chaîne de dépendances n'est pas décorative.
      - run: pnpm audit --prod --audit-level high
      # La chaîne de build : signalé, non bloquant — une alerte sur un paquet
      # transitif de Vite ne doit pas coincer une correction sans rapport.
      - run: pnpm audit --audit-level high
        continue-on-error: true

  # Scan de secrets sur **tout** l'historique, pas seulement le diff : un secret
  # commité puis retiré reste lisible dans les objets git. Le dépôt étant public,
  # GitHub scanne déjà les motifs des fournisseurs connus — gitleaks ajoute les
  # trois secrets propres au projet (clé Grist, secret de pseudonymisation, jeton
  # Matomo), que rien d'autre ne sait reconnaître (cf. .gitleaks.toml).
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks git --config .gitleaks.toml --no-banner --redact
