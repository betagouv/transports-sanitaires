name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  simulateur-eligibilite:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/simulateur-eligibilite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/simulateur-eligibilite/package-lock.json
      - run: npm ci
      # Lint d'abord : c'est la vérification la plus rapide, et la plus souvent
      # en défaut sur du code fraîchement écrit.
      - run: npm run lint
      - run: npm run valider-regles
      - run: npm test
      # `npm run build` enchaîne `tsc -b` (front, serveur, scripts, tests) puis Vite.
      - run: npm run build
