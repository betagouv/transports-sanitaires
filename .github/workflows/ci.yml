name: CI

on:
  push:
    branches: [main]
  pull_request:

# Chaque app est indépendante : son `working-directory`, son lock, son cache.
# Et chaque job appelle **`npm run verifier`**, la même commande que localement —
# c'est ce qui garantit qu'un `verifier` vert ici l'est aussi là-bas. Toute porte
# ajoutée se met dans le script, jamais dans ce fichier.
jobs:
  simulateur-eligibilite:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/simulateur-eligibilite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # La version supportée est déclarée par l'app (`engines.node`), pas ici.
          node-version-file: apps/simulateur-eligibilite/package.json
          cache: npm
          cache-dependency-path: apps/simulateur-eligibilite/package-lock.json
      - run: npm ci
      # Ce qui part en production : bloquant. Le simulateur parse du YAML fourni
      # par l'utilisateur (mode labo), la chaîne de dépendances n'est pas décorative.
      - run: npm audit --omit=dev --audit-level=critical
      # La chaîne de build : signalé, non bloquant — une alerte sur un paquet
      # transitif de Vite ne doit pas coincer une correction sans rapport.
      - run: npm audit --audit-level=critical
        continue-on-error: true
      # lint → typecheck → validation des règles → tests → build (+ vérification
      # de bundle en `postbuild`).
      - run: npm run verifier

  data-analyzer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/data-analyzer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/data-analyzer/package.json
          cache: npm
          cache-dependency-path: apps/data-analyzer/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=critical
      - run: npm audit --audit-level=critical
        continue-on-error: true
      - run: npm run verifier

  glossaire-notion:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/glossaire-notion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/glossaire-notion/package.json
          cache: npm
          cache-dependency-path: apps/glossaire-notion/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=critical
      - run: npm audit --audit-level=critical
        continue-on-error: true
      - run: npm run verifier

  # Scan de secrets sur **tout** l'historique, pas seulement le diff : un secret
  # commité puis retiré reste lisible dans les objets git. Le dépôt étant public,
  # GitHub scanne déjà les motifs des fournisseurs connus — gitleaks ajoute les
  # trois secrets propres au projet (clé Grist, secret de pseudonymisation, jeton
  # Matomo), que rien d'autre ne sait reconnaître (cf. .gitleaks.toml).
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks git --config .gitleaks.toml --no-banner --redact
