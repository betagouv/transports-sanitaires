# Configuration gitleaks du dépôt.
#
# Les règles par défaut couvrent les fournisseurs connus (AWS, GitHub, Stripe…),
# mais aucun des trois secrets de ce projet n'en fait partie : ce sont des chaînes
# hexadécimales anonymes, indistinguables d'un identifiant quelconque sans le nom
# de variable qui les précède. D'où ces trois règles, calées sur ce nom.

[extend]
useDefault = true

[[rules]]
id = "grist-api-key"
description = "Clé API Grist (source du référentiel établissements/services/prescripteurs)"
regex = '''(?i)grist[_-]?api[_-]?key["'\s]*[:=]["'\s]*([0-9a-f]{32,})'''
secretGroup = 1
tags = ["grist", "referentiel"]

[[rules]]
id = "pseudonymisation-secret"
description = "Secret HMAC de pseudonymisation (openssl rand -hex 32)"
regex = '''(?i)pseudonymisation[_-]?secret["'\s]*[:=]["'\s]*([0-9a-f]{32,})'''
secretGroup = 1
tags = ["identification", "rgpd"]

[[rules]]
id = "matomo-token-auth"
description = "Jeton d'API Matomo (token_auth)"
regex = '''(?i)token[_-]?auth["'\s]*[:=]["'\s]*([0-9a-f]{32})'''
secretGroup = 1
tags = ["matomo", "analytics"]

# `[[allowlists]]` et non `[allowlist]` : la forme au singulier est dépréciée, et
# gitleaks refuse de charger une configuration qui mêle les deux.

[[allowlists]]
description = "Gabarits et documentation : ces fichiers ne portent que des exemples vides."
paths = ['''\.env\.example$''', '''(^|/)README\.md$''', '''(^|/)AGENTS\.md$''']

# Deux fichiers listent des noms de règles publicodes, un par ligne : le contrat
# du front, et la recopie du livrable de l'éditeur que porte chaque version du
# modèle. La règle par défaut `generic-api-key` prend les plus longs pour des
# clés : à trente-six caractères, `p2_exception_radiotherapie_moins_48h` a
# l'entropie d'un secret. Aucun secret ne peut vivre là. Ces fichiers ne
# contiennent que des chaînes que le modèle et TypeScript confrontent à leurs
# appelants.
#
# Le second chemin est écrit pour la famille `livrable-v<majeure>-<mineure>.ts`,
# et pas pour la seule v9.7 : le fichier est recopié à l'identique à chaque
# version, et le faux positif reviendrait tel quel à la suivante.
#
# L'exception est **cantonnée à cette règle** par `targetRules` : les trois règles
# du projet continuent de s'appliquer à ces fichiers comme aux autres. Vérifié en
# y posant une fausse clé Grist, toujours détectée.
[[allowlists]]
description = "Noms de règles publicodes, pris pour des clés par generic-api-key"
targetRules = ["generic-api-key"]
paths = [
  '''apps/simulateur-eligibilite/front/simulateur/contrat-regles-publicodes\.ts$''',
  '''apps/simulateur-eligibilite/tests/simulateur/livrable-v[0-9]+-[0-9]+\.ts$''',
]
